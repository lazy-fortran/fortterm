name = "fortterm"
version = "0.1.0"
license = "MIT"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2026, Christopher Albert"
description = "Terminal emulator with kitty and sixel images, on FortUI"

[build]
auto-executables = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[preprocess]
cpp.suffixes = ["f90"]

[dependencies]
fortui = { git = "https://github.com/lazy-fortran/fortui.git", rev = "c7a2fb31ec79f7f1ada06aa30efe71e8068b90a6" }
